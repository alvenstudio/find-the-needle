<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#7ec8f2" />
    <meta
      name="description"
      content="Найди иголку - уютная игра от первого лица о том, как разобрать стог сена в миллион соломин."
    />
    <title>Найди иголку</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%AA%A1%3C/text%3E%3C/svg%3E" />
    <!--
      Yandex Games SDK. Root-relative and exactly this path: the platform serves
      it from the game's own origin, and a bundled or CDN copy is a rejection.
      The onerror is for every other environment - on a plain dev server this
      404s, and without the flag the wrapper would wait four seconds for a
      global that is never coming.
    -->
    <script src="/sdk.js" onerror="window.__yaSdkMissing = true"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="ui"></div>
    </div>
    <noscript>
      <p style="font: 16px/1.5 system-ui; padding: 2rem">
        Для «Найди иголку» нужны JavaScript и WebGL 2.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
